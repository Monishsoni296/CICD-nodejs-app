name: "CICD NodeJS App Deployment"

on:
    push:
        branches: [main]

        paths-ignore:
            - "README.md"
            - ".gitignore"

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: DockerHub Login
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build Docker Image
              run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-cicd-app .
            
            - name: Push Docker Image
              run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-cicd-app

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest

        steps:
            - name: Azure Login
              uses: azure/login@v2
              with:
                creds:  ${{ secrets.AZURE_CREDENTIALS }}
            
            - name: Deploy to Container App
              uses: azure/container-apps-deploy-action@v1
              with:
                  imageToDeploy: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/nodejs-cicd-app:latest
                  registryUrl: docker.io
                  registryUsername: ${{ secrets.DOCKERHUB_USERNAME }}
                  registryPassword: ${{ secrets.DOCKERHUB_PASSWORD }}
                  resourceGroup: rg-serverless-project
                  containerAppName: node-app-serverless
                  containerAppEnvironment: my-environment01
                  location: eastus
                  targetPort: 3000